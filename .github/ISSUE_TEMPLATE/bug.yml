
name: "🐛 Bug / 异常"
description: "记录可复现的问题、故障、异常行为或回归"
title: "[Bug] <请在此处输入简要描述>"
body:
  - type: markdown
    attributes:
      value: |
        请尽量提供可复现信息；涉及机械臂、底盘、电机、电源等真实硬件时，先保证人员和设备安全，再继续排查

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 简要说明发生了什么
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望现象
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际现象
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 根据项目填写 OS、ROS / Runtime、硬件、分支 / Commit、配置文件等
      placeholder: |
        - OS：
        - ROS / Runtime：
        - 硬件：
        - Branch / Commit：
        - 关键配置：

  - type: textarea
    id: evidence
    attributes:
      label: 日志 / 截图 / 波形 / 视频
      description: 请删除或打码个人隐私、Token、密码、设备敏感信息

  - type: textarea
    id: analysis
    attributes:
      label: 初步判断
      description: 如果暂时没有判断可填“暂无”

  - type: checkboxes
    id: safety
    attributes:
      label: 安全影响
      options:
        - label: 可能导致机械臂 / 底盘 / 电机等执行机构异常运动
        - label: 可能导致碰撞、超限、掉落、过流或其他设备风险
        - label: 仅影响软件、文档或非安全关键功能

  - type: markdown
    attributes:
      value: |
        ### 创建后怎么开始修复
        1. 推荐流程：**Issue → Branch → Commit → Push → Pull Request → 项目负责人 Merge**
        2. 从 Issue 的 `Development` 区域创建任务分支并在 git 本地切换分支；或者在 git 本地里从最新 `main` 手动创建分支并推送后，在 Issue 的 `Development` 区域绑定分支
        3. 推荐分支名：`fix/xxx`；这是协作约定，不做硬性拦截
        4. 请勿直接在 `main` 开发或 Push
        5. 如果已经误在 `main` 上产生了有用 Commit，**不要先 `reset --hard`**，先按协作指南把提交保存到新分支
